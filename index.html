<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk HD Photo & Video Optimizer Pro</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; margin-top: 0; }
        .drop-zone { border: 2px dashed #38bdf8; border-radius: 8px; padding: 30px; text-align: center; background: #0f172a; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .drop-zone:hover { background: #1b2735; }
        input[type="file"] { display: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #0369a1; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; }
        label { font-size: 14px; color: #cbd5e1; display: block; margin-bottom: 5px; }
        input[type="range"], select { width: 100%; cursor: pointer; background: #1e293b; color: white; border: 1px solid #334155; padding: 8px; border-radius: 4px; }
        .progress-bar { width: 100%; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin-bottom: 20px; display: none; }
        .progress-fill { width: 0%; height: 100%; background: #22c55e; transition: width 0.1s; }
        .log { background: #0f172a; padding: 12px; border-radius: 6px; height: 220px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #334155; }
        .file-item { display: flex; justify-content: space-between; margin-bottom: 6px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bulk HD Photo & Video Optimizer</h1>
        <p style="text-align:center; color:#94a3b8; font-size:14px; margin-top:-10px; margin-bottom:20px;">
            फुल ड्यूरेशन, परफेक्ट ऑडियो और 80% तक साइज़ कम्प्रेशन
        </p>
        
        <div class="drop-zone" id="dropZone">
            <p style="margin:0; font-size:16px;">यहाँ बल्क फोटो और वीडियो ड्रैग/ड्रॉप करें या क्लिक करके चुनें</p>
            <input type="file" id="fileInput" multiple accept="image/*,video/*">
        </div>

        <div class="controls">
            <div>
                <label for="quality">क्वालिटी व शार्पनेस: <strong id="qualityVal" style="color:#38bdf8;">85</strong>%</label>
                <input type="range" id="quality" min="50" max="100" value="85">
            </div>
            <div>
                <label for="resolution">वीडियो रेजोल्यूशन (Max Limit):</label>
                <select id="resolution">
                    <option value="original" selected>ओरिजिनल रेजोल्यूशन (HD)</option>
                    <option value="1080">1080p (Full HD - रिकमेंडेड)</option>
                    <option value="720">720p (Fast & Small Size)</option>
                </select>
            </div>
        </div>

        <button class="btn" id="startBtn" disabled>बल्क प्रोसेसिंग शुरू करें</button>

        <div class="progress-bar" id="progressBar" style="margin-top:20px;">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <h3 style="font-size:15px; margin-top:20px; color:#cbd5e1;">प्रोसेसिंग स्टेटस:</h3>
        <div class="log" id="logBox">कोई फाइल चुनी नहीं गई है...</div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const startBtn = document.getElementById('startBtn');
        const qualityInput = document.getElementById('quality');
        const qualityVal = document.getElementById('qualityVal');
        const resolutionSelect = document.getElementById('resolution');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const logBox = document.getElementById('logBox');

        let selectedFiles = [];

        qualityInput.addEventListener('input', () => qualityVal.textContent = qualityInput.value);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#22c55e'; });
        dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#38bdf8');
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#38bdf8';
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files).filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
            if (selectedFiles.length > 0) {
                const photos = selectedFiles.filter(f => f.type.startsWith('image/')).length;
                const videos = selectedFiles.filter(f => f.type.startsWith('video/')).length;
                logBox.innerHTML = `तैयार: कुल ${selectedFiles.length} फाइलें चुनी गईं (${photos} फोटो, ${videos} वीडियो)।`;
                startBtn.disabled = false;
            } else {
                logBox.innerHTML = `<span class="error">वैध फोटो या वीडियो फाइलें चुनें!</span>`;
                startBtn.disabled = true;
            }
        }

        startBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            startBtn.disabled = true;
            progressBar.style.display = 'block';
            logBox.innerHTML = 'ऑप्टिमाइजेशन शुरू हो रहा है...<br>';

            const qualityRatio = parseFloat(qualityInput.value) / 100;
            const resOption = resolutionSelect.value;
            let processedCount = 0;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                try {
                    let optimizedBlob, newFileName;
                    
                    if (file.type.startsWith('image/')) {
                        optimizedBlob = await processImageHD(file, qualityRatio);
                        newFileName = file.name.substring(0, file.name.lastIndexOf('.')) + '_HD.webp';
                    } else if (file.type.startsWith('video/')) {
                        optimizedBlob = await processVideoHD(file, qualityRatio, resOption);
                        newFileName = file.name.substring(0, file.name.lastIndexOf('.')) + '_HD.webm';
                    }

                    downloadBlob(optimizedBlob, newFileName);
                    
                    const oldMB = (file.size / (1024 * 1024)).toFixed(2);
                    const newMB = (optimizedBlob.size / (1024 * 1024)).toFixed(2);
                    const savings = (((file.size - optimizedBlob.size) / file.size) * 100).toFixed(0);

                    logBox.innerHTML += `<div class="file-item success">✔ ${file.name} (${oldMB} MB ➔ ${newMB} MB) [${savings}% साइज़ कम]</div>`;
                } catch (err) {
                    logBox.innerHTML += `<div class="file-item error">✖ ${file.name} - एरर: ${err.message}</div>`;
                }

                processedCount++;
                progressFill.style.width = Math.round((processedCount / selectedFiles.length) * 100) + '%';
                logBox.scrollTop = logBox.scrollHeight;
            }

            logBox.innerHTML += `<br><strong class="success">सभी फाइलें 100% सही ड्यूरेशन और साउंड के साथ कंवर्ट हो गईं!</strong>`;
            startBtn.disabled = false;
        });

        // Instant Photo Processing with Sharpness Filter
        function processImageHD(file, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);

                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');

                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.filter = 'contrast(102%) saturate(103%)';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob((blob) => {
                        if (blob) resolve(blob);
                        else reject(new Error('इमेज कंवर्ट नहीं हो सकी'));
                    }, 'image/webp', quality);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('फोटो लोड नहीं हो सकी')); };
                img.src = url;
            });
        }

        // Full Duration & Audio Synced Video Processing
        function processVideoHD(file, quality, resOption) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.muted = false;
                video.volume = 0.001; // Sound capture enabled

                video.onloadeddata = () => {
                    try {
                        let targetWidth = video.videoWidth;
                        let targetHeight = video.videoHeight;

                        // Optional Resolution Scaling to Control Size
                        if (resOption === '1080' && targetHeight > 1080) {
                            targetWidth = Math.round((1080 / targetHeight) * targetWidth);
                            targetHeight = 1080;
                        } else if (resOption === '720' && targetHeight > 720) {
                            targetWidth = Math.round((720 / targetHeight) * targetWidth);
                            targetHeight = 720;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = targetWidth;
                        canvas.height = targetHeight;
                        const ctx = canvas.getContext('2d');

                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';

                        const canvasStream = canvas.captureStream(30);

                        let audioTrack = null;
                        if (video.captureStream) {
                            const videoStream = video.captureStream();
                            if (videoStream.getAudioTracks().length > 0) audioTrack = videoStream.getAudioTracks()[0];
                        } else if (video.mozCaptureStream) {
                            const videoStream = video.mozCaptureStream();
                            if (videoStream.getAudioTracks().length > 0) audioTrack = videoStream.getAudioTracks()[0];
                        }

                        if (audioTrack) canvasStream.addTrack(audioTrack);

                        let mimeType = 'video/webm;codecs=vp9,opus';
                        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

                        const bitrate = Math.max(1200000, Math.round(3500000 * quality));
                        const mediaRecorder = new MediaRecorder(canvasStream, {
                            mimeType: mimeType,
                            videoBitsPerSecond: bitrate
                        });

                        const chunks = [];
                        mediaRecorder.ondataavailable = (e) => {
                            if (e.data.size > 0) chunks.push(e.data);
                        };

                        mediaRecorder.onstop = () => {
                            const blob = new Blob(chunks, { type: 'video/webm' });
                            URL.revokeObjectURL(video.src);
                            resolve(blob);
                        };

                        mediaRecorder.start();
                        video.play();

                        function renderFrame() {
                            if (video.paused || video.ended) {
                                if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                                return;
                            }
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            requestAnimationFrame(renderFrame);
                        }

                        video.onended = () => {
                            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                        };

                        renderFrame();
                    } catch (err) {
                        URL.revokeObjectURL(video.src);
                        reject(err);
                    }
                };

                video.onerror = () => {
                    URL.revokeObjectURL(video.src);
                    reject(new Error('वीडियो लोड नहीं हो सका'));
                };
            });
        }

        function downloadBlob(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
